<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <script>
    // set theme before paint to avoid a flash
    (function () {
      try {
        var t = localStorage.getItem("theme") ||
          (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) { document.documentElement.setAttribute("data-theme", "dark"); }
    })();
  </script>
  <title>Bank Radar · Bank, Fintech &amp; Exchange News + Events</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="48x48" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#0f141c" />
  <meta name="description" content="Bank, fintech &amp; exchange product news &amp; events from across the Americas, with a daily AI brief." />
  <link rel="canonical" href="https://bank-radar.raykhan.me/" />
  <!-- link previews (Slack, LinkedIn, iMessage, X, etc.); image source: docs/og-image.html -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Bank Radar" />
  <meta property="og:locale" content="en_CA" />
  <meta property="og:url" content="https://bank-radar.raykhan.me/" />
  <meta property="og:title" content="Bank Radar" />
  <meta property="og:description" content="Bank, fintech &amp; exchange product news &amp; events from across the Americas, with a daily AI brief." />
  <meta property="og:image" content="https://bank-radar.raykhan.me/og-image.jpg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Bank Radar: bank and fintech product news and events from across the Americas, with a radar graphic." />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Bank Radar" />
  <meta name="twitter:description" content="Bank, fintech &amp; exchange product news &amp; events from across the Americas, with a daily AI brief." />
  <meta name="twitter:image" content="https://bank-radar.raykhan.me/og-image.jpg" />
  <meta name="twitter:image:alt" content="Bank Radar: bank and fintech product news and events from across the Americas, with a radar graphic." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- loading overlay: removed by app.js once the data has rendered -->
  <div id="loader" class="loader" role="status" aria-label="Loading Bank Radar">
    <div class="radar" aria-hidden="true">
      <div class="radar-sweep"></div>
      <!-- blips: position = angle/distance from center; --d = when the sweep reaches that angle (angle/360 × 2.4s) -->
      <span class="blip" style="left:69%;top:27%;--d:.27s"></span>
      <span class="blip" style="left:84%;top:66%;--d:.77s"></span>
      <span class="blip" style="left:42%;top:71%;--d:1.33s"></span>
      <span class="blip" style="left:17%;top:41%;--d:1.9s"></span>
      <span class="blip" style="left:43%;top:38%;--d:2.2s"></span>
    </div>
    <p class="loader-title">Bank Radar</p>
    <p class="loader-sub">Scanning the Americas…</p>
  </div>

  <header class="topbar">
    <div class="brand">
      <span class="dot"></span>
      <div>
        <h1>Bank Radar</h1>
        <p class="sub">Bank, fintech &amp; exchange product news &amp; events from across the Americas · Updated daily</p>
      </div>
    </div>
    <button id="moneyBtn" class="money-btn" type="button" aria-label="Make it rain money">💰</button>
    <div class="topbar-right">
      <button id="themeToggle" class="theme-switch" type="button" role="switch" aria-label="Toggle light/dark theme">
        <span class="ts-stars"></span>
        <span class="ts-clouds"></span>
        <span class="ts-knob"></span>
      </button>
      <div class="meta" id="meta">loading…</div>
    </div>
  </header>

  <main>
    <section class="col news-col">
      <div id="brief" class="brief"></div>

      <div class="col-head" id="news-stream">
        <h2>News stream</h2>
        <input id="search" type="search" placeholder="Search companies, features, offers…" />
      </div>

      <div id="controls">
        <div class="filters">
          <button class="chip active" data-group="cat" data-value="all">All</button>
          <button class="chip" data-group="cat" data-value="product">Product updates</button>
          <button class="chip" data-group="cat" data-value="offer">Offers</button>
          <button class="chip" data-group="cat" data-value="service">Service updates</button>
          <span class="spacer"></span>
          <select id="bankFilter" class="select" aria-label="Filter by company">
            <option value="all">All companies</option>
          </select>
        </div>
        <div class="filters subfilters">
          <button class="chip active" data-group="sector" data-value="all">All sectors</button>
          <button class="chip" data-group="sector" data-value="bank">Banks</button>
          <button class="chip" data-group="sector" data-value="fintech">Fintech</button>
          <button class="chip" data-group="sector" data-value="exchange">Exchanges &amp; trading</button>
          <span class="spacer"></span>
          <button class="chip active" data-group="region" data-value="all">All regions</button>
          <button class="chip" data-group="region" data-value="NA">N. America</button>
          <button class="chip" data-group="region" data-value="SA">S. America</button>
        </div>
      </div>

      <div id="news" class="list"></div>
    </section>

    <section class="col events-col">
      <div class="col-head" id="events-calendar"><h2>Events calendar</h2></div>
      <div id="eventControls" class="filters"></div>
      <div id="events" class="list"></div>
    </section>
  </main>

  <footer>
    <span id="footnote"></span>
  </footer>

  <!-- desktop only: appears once the page is scrolled down -->
  <button id="toTop" class="to-top" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
    Back to top
  </button>

  <!-- phones only: tab bar fixed to the bottom of the screen -->
  <nav id="jumpMenu" class="jump-menu" aria-label="Sections">
    <a href="#brief">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg>
      <span>Daily brief</span>
    </a>
    <a href="#news-stream">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>
      <span>News</span>
    </a>
    <a href="#events-calendar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>
      <span>Events</span>
    </a>
  </nav>

  <script src="app.js"></script>
</body>
</html>
