<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <script>
    // set theme before paint to avoid a flash
    (function () {
      try {
        var t = localStorage.getItem("theme") ||
          (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) { document.documentElement.setAttribute("data-theme", "dark"); }
    })();
  </script>
  <title>Bank Radar · Simplii Product</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="48x48" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#0f141c" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="bg-gradient" aria-hidden="true"></div>
  <header class="topbar">
    <div class="brand">
      <span class="dot"></span>
      <div>
        <h1>Bank Radar</h1>
        <p class="sub">Bank &amp; fintech product news &amp; events from across the Americas</p>
      </div>
    </div>
    <button id="moneyBtn" class="money-btn" type="button" aria-label="Make it rain money">💰</button>
    <div class="topbar-right">
      <button id="themeToggle" class="theme-switch" type="button" role="switch" aria-label="Toggle light/dark theme">
        <span class="ts-stars"></span>
        <span class="ts-clouds"></span>
        <span class="ts-knob"></span>
      </button>
      <div class="meta" id="meta">loading…</div>
    </div>
  </header>

  <main>
    <section class="col news-col">
      <div id="brief" class="brief"></div>

      <div class="col-head">
        <h2>News stream</h2>
        <input id="search" type="search" placeholder="Search banks, features, offers…" />
      </div>

      <div id="controls">
        <div class="filters">
          <button class="chip active" data-group="cat" data-value="all">All</button>
          <button class="chip" data-group="cat" data-value="product">Product updates</button>
          <button class="chip" data-group="cat" data-value="offer">Offers</button>
          <button class="chip" data-group="cat" data-value="service">Service updates</button>
          <span class="spacer"></span>
          <select id="bankFilter" class="select" aria-label="Filter by bank">
            <option value="all">All banks</option>
          </select>
        </div>
        <div class="filters subfilters">
          <button class="chip focus active" data-group="focus" data-value="all">Everyone</button>
          <button class="chip focus" data-group="focus" data-value="own">Simplii</button>
          <button class="chip focus" data-group="focus" data-value="competitors">Competitors</button>
          <span class="spacer"></span>
          <button class="chip active" data-group="region" data-value="all">All regions</button>
          <button class="chip" data-group="region" data-value="NA">N. America</button>
          <button class="chip" data-group="region" data-value="SA">S. America</button>
        </div>
      </div>

      <div id="news" class="list"></div>
    </section>

    <section class="col events-col">
      <div class="col-head"><h2>Events calendar</h2></div>
      <div id="eventControls" class="filters"></div>
      <div id="events" class="list"></div>
    </section>
  </main>

  <footer>
    <span id="footnote"></span>
  </footer>

  <script src="app.js"></script>
  <!-- animated background: ShaderGradient (React + three.js) loaded straight from the CDN, no build step -->
  <script type="importmap">
    { "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
      "react-dom": "https://esm.sh/react-dom@18.3.1?external=react",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?external=react",
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "@react-three/fiber": "https://esm.sh/@react-three/fiber@8.17.14?external=react,react-dom,three",
      "@shadergradient/react": "https://esm.sh/@shadergradient/react@2.4.20?external=react,react-dom,three,@react-three/fiber"
    } }
  </script>
  <script type="module" src="bg-gradient.js"></script>
</body>
</html>
